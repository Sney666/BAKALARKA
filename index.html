<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rogue Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Draft obrazovka (Výběr na začátku) -->
    <div id="draft-overlay" class="hidden">
        <div id="draft-modal">
            <h2>Vyber si 2 startovní karty</h2>
            <div id="draft-cards" class="card-container"></div>
            <button id="btn-confirm-draft" disabled onclick="game.confirmDraft()">Potvrdit výběr</button>
        </div>
    </div>

    <div id="game-container">
        <!-- Horní informační lišta -->
        <header id="top-bar">
            <div class="stat">❤️ HP: <span id="ui-hp">5/5</span></div>
            <div class="stat">🪙 Mince: <span id="ui-coins">0</span></div>
            <div class="stat">🌊 Vlna: <span id="ui-wave">1</span></div>
        </header>

        <!-- Hlavní herní plocha -->
        <main>
            <div id="grid"></div>
        </main>

        <!-- Ovládací panely a akce -->
        <div id="action-bar">
            <button id="btn-wait" onclick="game.wait()">⏳ Čekat</button>
            <button id="btn-scream" onclick="game.vikingScream()">
                🗣️ Viking Scream <span id="ui-cooldown"></span>
            </button>
            <button id="btn-execute" onclick="game.startExecution()" class="highlight-btn" disabled>
                ⚔️ Zahrát karty
            </button>
        </div>

        <!-- Spodní prostor pro karty -->
        <footer id="bottom-bar">
            <div class="card-area-title">Připravené karty (Vykonají se zleva doprava)</div>
            <div id="prepared-slots" class="card-container slots">
                <!-- Vygeneruje JS -->
            </div>
            
            <div class="card-area-title" style="margin-top: 15px;">Ruka (Kliknutím připravíš za 1 tah)</div>
            <div id="hand-cards" class="card-container">
                <!-- Vygeneruje JS -->
            </div>
        </footer>
    </div>
    <script src="game.js"></script>
</body>
</html>
