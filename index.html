<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rogue Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Horní informační lišta -->
        <header id="top-bar">
            <div class="stat">❤️ HP: <span id="ui-hp">5/5</span></div>
            <div class="stat">🪙 Mince: <span id="ui-coins">0</span></div>
            <div class="stat">🌊 Vlna: <span id="ui-wave">1</span></div>
        </header>

        <!-- Hlavní herní plocha -->
        <main>
            <div id="grid"></div>
        </main>

        <!-- Ovládací panely a akce -->
        <div id="action-bar">
            <button id="btn-wait" onclick="game.wait()">⏳ Čekat</button>
            <button id="btn-scream" onclick="game.vikingScream()">
                🗣️ Viking Scream <span id="ui-cooldown"></span>
            </button>
        </div>

        <!-- Spodní prostor pro karty -->
        <footer id="bottom-bar">
            <div class="card-area-title">Připravené karty / Ruka</div>
            <div class="card-slots">
                <div class="card-slot empty">Slot 1</div>
                <div class="card-slot empty">Slot 2</div>
                <div class="card-slot empty">Slot 3</div>
                <div class="card-slot empty">Slot 4</div>
            </div>
        </footer>
    </div>
    <script src="game.js"></script>
</body>
</html>
